<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab ERP model</title>
<style id="wb-style">
:root{--bg:#faf9f7;--sf:#fff;--sf2:#f3f1ec;--tx:#22211f;--tx2:#5f5e5a;--tx3:#8b8a84;--bd:#e3e0d9;--bd2:#c9c6bd;
--ac:#534ab7;--acbg:#eeedfe;--acbr:#7f77dd;--ok:#0f6e56;--okbg:#e1f5ee;--okbr:#1d9e75;--wa:#854f0b;--wabg:#faeeda;--wabr:#ba7517;
--er:#a32d2d;--erbg:#fcebeb;--erbr:#e24b4a;--r:8px;
--teal-bg:#e1f5ee;--teal-br:#1d9e75;--teal-tx:#085041;--green-bg:#eaf3de;--green-br:#639922;--green-tx:#27500a;
--gray-bg:#f1efe8;--gray-br:#888780;--gray-tx:#444441;--purple-bg:#eeedfe;--purple-br:#7f77dd;--purple-tx:#3c3489;
--blue-bg:#e6f1fb;--blue-br:#378add;--blue-tx:#0c447c;--coral-bg:#faece7;--coral-br:#d85a30;--coral-tx:#712b13}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a18;--sf:#232321;--sf2:#2b2b28;--tx:#eceae4;--tx2:#a8a69e;--tx3:#7b7a74;--bd:#38372f;--bd2:#4b4a42;
--ac:#afa9ec;--acbg:#3c3489;--acbr:#7f77dd;--ok:#9fe1cb;--okbg:#085041;--okbr:#1d9e75;--wa:#fac775;--wabg:#633806;--wabr:#ba7517;
--er:#f7c1c1;--erbg:#791f1f;--erbr:#e24b4a;
--teal-bg:#0b3a30;--teal-tx:#9fe1cb;--green-bg:#1f330c;--green-tx:#c0dd97;--gray-bg:#2c2c2a;--gray-tx:#d3d1c7;
--purple-bg:#26215c;--purple-tx:#cecbf6;--blue-bg:#0c2a49;--blue-tx:#b5d4f4;--coral-bg:#4a1b0c;--coral-tx:#f5c4b3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1{font-size:18px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 6px}
h3{font-size:13px;font-weight:600;margin:0 0 6px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 10px;color:var(--tx2);font-size:14px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:13.5px;width:100%}
input[type=checkbox]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acbr);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;line-height:1.55;overflow:hidden;min-height:38px}
button{background:transparent;border:1px solid var(--bd2);border-radius:var(--r);padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--sf2)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri:hover{opacity:.9;background:var(--ac)}
button.sm{padding:3px 9px;font-size:12.5px}
button.ic{padding:2px 7px;color:var(--tx3);border-color:transparent}
button.ic:hover{color:var(--er);border-color:var(--bd)}
button.on{background:var(--acbg);border-color:var(--acbr);color:var(--ac)}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.stat{font-size:12.5px;color:var(--tx3)}
.stat b{color:var(--tx);font-weight:600}
#savestate{font-size:12.5px;padding:3px 9px;border-radius:20px}
.ss-saved{color:var(--ok);background:var(--okbg)}
.ss-dirty{color:var(--wa);background:var(--wabg)}
.ss-err{color:var(--er);background:var(--erbg)}
#banner{display:flex;flex-direction:column;gap:6px;padding:0 20px}
#banner:not(:empty){padding:10px 20px}
.ban{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--wabg);color:var(--wa);border:1px solid var(--wabr);border-radius:var(--r);padding:8px 12px;font-size:13.5px}
.ban.info{background:var(--acbg);color:var(--ac);border-color:var(--acbr)}
.ban.err{background:var(--erbg);color:var(--er);border-color:var(--erbr)}
.ban span{flex:1;min-width:240px}
.tabs{display:flex;gap:2px;padding:0 20px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:51px;z-index:29;overflow-x:auto}
.tab{padding:9px 14px;font-size:13.5px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--ac);border-bottom-color:var(--acbr);font-weight:600}
.tab .cnt{font-size:11px;background:var(--erbg);color:var(--er);border-radius:10px;padding:0 6px;margin-left:4px}
.tab .cnt.ok{background:var(--okbg);color:var(--ok)}
main{padding:18px 20px 60px;max-width:1600px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--tx3);font-size:12.5px}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600;margin-bottom:3px;display:block}
.fld{margin-bottom:10px}
.pill{font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid;white-space:nowrap;display:inline-block;line-height:1.6}
.s-B{background:var(--teal-bg);border-color:var(--teal-br);color:var(--teal-tx)}
.s-P{background:var(--acbg);border-color:var(--acbr);color:var(--ac)}
.s-O{background:var(--wabg);border-color:var(--wabr);color:var(--wa)}
.s-C{background:var(--sf2);border-color:var(--bd2);color:var(--tx2)}
.v-ok{background:var(--okbg);border-color:var(--okbr);color:var(--ok)}
.v-change{background:var(--wabg);border-color:var(--wabr);color:var(--wa)}
.v-drop{background:var(--erbg);border-color:var(--erbr);color:var(--er)}
.chg{background:var(--wabg);border-color:var(--wabr);color:var(--wa)}
.chg.tidy{background:var(--sf2);border-color:var(--bd2);color:var(--tx2)}
.chgnote{font-size:12.5px;border-radius:var(--r);padding:7px 10px;margin:8px 0;background:var(--wabg);color:var(--wa);border:1px solid var(--wabr)}
.chgnote.tidy{background:var(--sf2);color:var(--tx2);border-color:var(--bd)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wabr);margin-left:4px;vertical-align:1px}
.a-teal{--abg:var(--teal-bg);--abr:var(--teal-br);--atx:var(--teal-tx)}
.a-green{--abg:var(--green-bg);--abr:var(--green-br);--atx:var(--green-tx)}
.a-gray{--abg:var(--gray-bg);--abr:var(--gray-br);--atx:var(--gray-tx)}
.a-purple{--abg:var(--purple-bg);--abr:var(--purple-br);--atx:var(--purple-tx)}
.a-blue{--abg:var(--blue-bg);--abr:var(--blue-br);--atx:var(--blue-tx)}
.a-coral{--abg:var(--coral-bg);--abr:var(--coral-br);--atx:var(--coral-tx)}
.achip{font-size:11.5px;padding:1px 9px;border-radius:20px;background:var(--abg);color:var(--atx);border:1px solid var(--abr);white-space:nowrap}
/* map */
.maptools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.mapscroll{overflow:auto;height:calc(100vh - 190px);min-height:420px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;position:relative}
.mapsizer{position:relative}
.mapcanvas{position:absolute;left:0;top:0;transform-origin:0 0}
.marea{position:absolute;border-radius:14px;background:color-mix(in srgb,var(--abg) 55%,transparent);border:1px solid color-mix(in srgb,var(--abr) 35%,transparent)}
.marea .ah{position:absolute;left:14px;top:8px;right:14px;font-size:13px;font-weight:600;color:var(--atx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.marea .ah span{display:block;font-size:11.5px;font-weight:400;opacity:.85;overflow:hidden;text-overflow:ellipsis}
.mcard{position:absolute;background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--abr);border-radius:9px;padding:6px 10px 7px;cursor:pointer;transition:opacity .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.mcard:hover{box-shadow:0 0 0 2px var(--acbr)}
.mcard .mt{display:flex;align-items:baseline;gap:6px}
.mcard .mid{font-size:10.5px;color:var(--atx);font-variant-numeric:tabular-nums;opacity:.85}
.mcard .mn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mcard .md{font-size:11.5px;color:var(--tx2);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.mcard .mflag{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%}
.mcard.vok{border-right:3px solid var(--okbr)}.mcard.vchange{border-right:3px solid var(--wabr)}.mcard.vdrop{border-right:3px solid var(--erbr)}
.mcard.sel{box-shadow:0 0 0 2px var(--ac)}
.mcard.dim{opacity:.18}
.mcard.nb{box-shadow:0 0 0 1.5px var(--acbr)}
.medges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edge{fill:none;stroke:var(--bd2);stroke-width:1.1;opacity:.5;transition:opacity .15s}
.edge.opt{stroke-dasharray:4 3}
.edge.hl{stroke:var(--ac);opacity:1;stroke-width:1.7}
.edge.dim{opacity:.05}
.elab{font-size:11px;fill:var(--ac);font-weight:500}
.elabbg{fill:var(--sf);opacity:.92}
.mappanel{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}
.mappanel .card{padding:14px 16px}
.conn{font-size:13px;padding:6px 0;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:baseline}
.conn:first-of-type{border-top:0}
.conn .cd{font-size:11px;color:var(--tx3);white-space:nowrap;min-width:52px}
.conn a{color:var(--ac);cursor:pointer;text-decoration:none;font-weight:500}
.conn a:hover{text-decoration:underline}
.legrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);margin:5px 0}
/* entities */
.secth{display:flex;align-items:baseline;gap:10px;font-size:14px;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.secth span{font-weight:400;color:var(--tx3);font-size:12.5px}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:14px}
.ecard{background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--abr);border-radius:12px;padding:14px 16px}
.ecard.vok{box-shadow:inset -3px 0 0 var(--okbr)}.ecard.vchange{box-shadow:inset -3px 0 0 var(--wabr)}.ecard.vdrop{box-shadow:inset -3px 0 0 var(--erbr)}
.egrid>.ecard:has(details[open]){grid-column:1 / -1}
.ecard.flash{animation:fl 1.4s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--acbr)}100%{box-shadow:0 0 0 0 transparent}}
.idtag{width:74px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--tx3);background:var(--sf2);border-color:transparent;text-align:center;padding:4px 2px;flex:none}
.ename{flex:1;min-width:110px;font-weight:600;font-size:15px;border-color:transparent;background:transparent;padding-left:2px}
details{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}
summary{cursor:pointer;font-size:12.5px;color:var(--tx3);list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary:before{content:"\25B8";font-size:10px;display:inline-block;transition:transform .15s}
details[open] summary:before{transform:rotate(90deg)}
summary:hover{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600;padding:0 6px 6px 0;border-bottom:1px solid var(--bd)}
td{padding:3px 6px 3px 0;border-bottom:1px solid var(--bd);vertical-align:middle}
td input,td select{padding:3px 6px;font-size:12.5px}
tr.isref td:first-child input{color:var(--ac)}
tr.isunit td input{color:var(--tx3)}
.filt{display:flex;gap:6px;flex-wrap:wrap}
/* connections */
.rlist .ri{display:grid;grid-template-columns:minmax(0,1fr) 92px 150px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--bd)}
.rlist .ri .sent{font-size:13.5px}
.rlist .ri .sent a{color:var(--ac);cursor:pointer;font-weight:500}
.rlist .ri .cm{grid-column:1 / -1;display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px}
/* checks */
.iss{display:grid;grid-template-columns:74px 160px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--bd);font-size:13.5px;align-items:baseline}
.iss a{color:var(--ac);cursor:pointer}
.sev{font-size:11px;padding:1px 8px;border-radius:20px;text-align:center}
.sev.error{background:var(--erbg);color:var(--er)}.sev.warn{background:var(--wabg);color:var(--wa)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:14px}
.steps{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
@media (max-width:1100px){.mapgrid{grid-template-columns:1fr}.mappanel{position:static;max-height:none}}
@media print{header,.tabs,#banner,button{display:none}}
.qsrc{font-size:10px;color:var(--wa,#8a5a00);margin-top:3px;white-space:nowrap}
body.ro [data-add],body.ro [data-addf],body.ro [data-addu],body.ro [data-delf],body.ro [data-dele],body.ro [data-delp],body.ro [data-delq],body.ro [data-act="import"]{display:none}
/* layout helpers */
.esearch{width:180px}
#focusSel{width:300px;max-width:100%}
.qwrap{overflow-x:auto}
.pickrow{display:grid;grid-template-columns:repeat(2,minmax(0,230px));gap:10px;margin-bottom:12px}
.pickrow select{width:100%}
.olab{display:none}
/* phones */
@media (max-width:700px){
header{position:static;padding:10px 12px;gap:6px 8px}
#ttl{font-size:16px}
#stats{flex-basis:100%;font-size:11.5px;line-height:1.5}
.tabs{top:0;padding:0 6px}
.tab{padding:10px 10px}
main{padding:12px 10px 60px}
.card{padding:14px 14px}
.ecard{padding:12px 12px}
input,select,textarea{font-size:16px}
td input,td select{font-size:15px;padding:6px 8px}
.esearch{width:100%}
.ehead{flex-wrap:wrap!important}
.ehead .ename{min-width:0;flex:1 1 0}
.ehead select{flex:1 1 100%;width:100%!important}
.secth{flex-wrap:wrap;gap:4px 8px}
/* entity fields: one small block per field */
table.ftab,table.ftab tbody{display:block}
table.ftab thead{display:none}
table.ftab tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 14px 30px;grid-template-areas:"n n dot del" "t s s s" "o o o o" "note note note note";gap:6px;padding:10px 0;border-bottom:1px solid var(--bd)}
table.ftab tr:first-child{padding-top:2px}
table.ftab td{display:block;width:auto!important;border:0;padding:0;text-align:left!important}
.c-n{grid-area:n}.c-t{grid-area:t}.c-s{grid-area:s}.c-note{grid-area:note}.c-del{grid-area:del;justify-self:end}
.c-dot{grid-area:dot;align-self:center}
.c-o{grid-area:o}.c-o:not(.has){display:none!important}
.c-o label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2)}
.olab{display:inline}
.c-n input{font-weight:500}
/* connections */
.radwrap{overflow-x:auto;margin:0 -4px}
.radwrap svg{min-width:600px}
#focusSel{width:100%}
.rlist .ri{grid-template-columns:auto minmax(0,1fr);gap:8px;padding:10px 0}
.rlist .ri .sent{grid-column:1 / -1}
.rlist .ri .cm{grid-template-columns:1fr}
/* processes */
.pickrow{grid-template-columns:1fr 1fr}
/* questions: one block per question */
.qwrap{overflow:visible}
table.qtab,table.qtab tbody{display:block}
table.qtab thead{display:none}
table.qtab tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px;grid-template-areas:"id st del" "t t t" "p w w" "a a a";gap:8px 6px;padding:14px 0;border-bottom:1px solid var(--bd)}
table.qtab td{display:block;width:auto!important;border:0;padding:0}
.q-id{grid-area:id;display:flex!important;align-items:center;gap:10px}.q-id input{width:96px}.q-id .qsrc{margin:0}
.q-t{grid-area:t}.q-p{grid-area:p}.q-w{grid-area:w}.q-st{grid-area:st}.q-a{grid-area:a}.q-del{grid-area:del;justify-self:end}
table.qtab td[data-l]:before{content:attr(data-l);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600;margin-bottom:3px}
table.qtab select{width:100%}
/* checks */
.iss{grid-template-columns:64px minmax(0,1fr);gap:4px 10px}
.iss>span:last-child{grid-column:1 / -1}
}
</style>
</head>
<body>

<h1 id="ttl">Lab ERP model</h1>
<span class="stat" id="stats"></span>
<span id="savestate"></span>
<span style="margin-left:auto"></span>

<div id="banner"></div>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<input type="file" id="impfile" accept=".json" style="display:none">
<datalist id="typelist"></datalist>

<script>(function(){
"use strict";
var STYLE_TXT=document.getElementById("wb-style").textContent;
var APP_TXT=document.currentScript.textContent;
var SHELL_TXT="<header>\n<h1 id=\"ttl\">Lab ERP model</h1>\n<span class=\"stat\" id=\"stats\"></span>\n<span id=\"savestate\"></span>\n<span style=\"margin-left:auto\"></span>\n<button data-act=\"import\" title=\"Merge verdicts, comments and answers from an exported JSON of an older workbench\">Import notes</button>\n</header>\n<div id=\"banner\"></div>\n<div class=\"tabs\" id=\"tabs\"></div>\n<main id=\"main\"></main>\n<input type=\"file\" id=\"impfile\" accept=\".json\" style=\"display:none\">\n<datalist id=\"typelist\"></datalist>\n";
var state=JSON.parse(document.getElementById("model-data").textContent);
var OLD_KEY="laberp-workbench-v1";
var dirty=false,savedAt=null,READONLY=true;
var tab="map",sel=null,hov=null,zoom=1,focusId=null,filt="all",query="",hlMode="none",pfilt="all",qfilt="all";
var openF={};
var LIVE=false,REV=0,base=null,inflight=false,pushT=null,netErr="",API="api/state";

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function E(id){for(var i=0;i<state.entities.length;i++)if(state.entities[i].id===id)return state.entities[i];return null}
function EI(id){for(var i=0;i<state.entities.length;i++)if(state.entities[i].id===id)return i;return -1}
function area(id){for(var i=0;i<state.areas.length;i++)if(state.areas[i].id===id)return state.areas[i];return null}
function acls(e){var a=e&&area(e.area);return "a-"+(a?a.color:"gray")}
function parseT(t){var m=/^(ref|list)\s+(\S+)\s*$/.exec(t||"");return m?{k:m[1],id:m[2]}:null}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\-]/g,"\\$&")}
function setPath(p,v){var k=p.split("."),o=state;for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function sel_(path,val,opts,attrs){return '<select data-p="'+path+'"'+(attrs||"")+'>'+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return '<option value="'+esc(v)+'"'+(String(val==null?"":val)===String(v)?" selected":"")+'>'+esc(l)+'</option>'}).join("")+'</select>'}
var ST=[["B","BRIEF, given"],["P","PROPOSED, confirm"],["O","OPEN, unknown"],["C","STANDARD ERP"]];
var VD=[["","not reviewed"],["ok","confirmed"],["change","needs change"],["drop","wrong or not needed"]];
var PR=[["A","A blocks the reference"],["B","B blocks a block"],["C","C later"]];
var WH=[["Systasy","Systasy"],["Expert","Expert"],["Sample data","Sample data"],["Team","Team"]];
var QS=[["open","open"],["answered","answered"],["na","not relevant"]];
var PP=[["","not decided"],["must","must, prototype"],["should","should"],["later","later"]];
var KNOWN=["text","int","decimal","money","bool","date","datetime","enum","json","derived","weekday set","date ranges"];

/* ---------- relations, derived from fields ---------- */
function rels(){
  var out=[];
  state.entities.forEach(function(e,ei){e.f.forEach(function(f,fi){
    var p=parseT(f.t);if(!p||p.id==="MD-14")return;
    if(p.k==="ref"){out.push({a:e.id,b:p.id,ei:ei,fi:fi,f:f,kind:f.opt?"opt":"one"});return}
    var t=E(p.id),back=t&&t.f.some(function(g){var q=parseT(g.t);return q&&q.k==="ref"&&q.id===e.id});
    if(!back)out.push({a:e.id,b:p.id,ei:ei,fi:fi,f:f,kind:"many"});
  })});
  return out;
}
function sentence(r,linkA,linkB){
  var A=E(r.a),B=E(r.b),an=A?A.n:r.a,bn=B?B.n:r.b,l=r.f.l||r.f.n;
  var a=linkA?'<a data-go="'+esc(r.a)+'">'+esc(an)+'</a>':esc(an),b=linkB?'<a data-go="'+esc(r.b)+'">'+esc(bn)+'</a>':esc(bn);
  if(r.kind==="many")return {s:"Each "+a+" "+esc(l)+" several "+b+", and one "+b+" can be linked to several "+a,c:"n : m"};
  return {s:"Each "+a+" "+esc(l)+" "+(r.kind==="opt"?"at most one ":"one ")+b,c:r.kind==="opt"?"n : 0..1":"n : 1"};
}

/* ---------- consistency checks ---------- */
function checks(){
  var out=[],ids={};
  function add(sev,e,f,msg){out.push({sev:sev,e:e?e.id:"",en:e?e.n:"",f:f?f.n:"",msg:msg})}
  state.entities.forEach(function(e){if(ids[e.id])add("error",e,null,"Entity id used twice");ids[e.id]=1});
  var R=rels(),deg={};
  R.forEach(function(r){deg[r.a]=(deg[r.a]||0)+1;deg[r.b]=(deg[r.b]||0)+1});
  var qids={};state.questions.forEach(function(q){qids[q.id]=1});
  state.entities.forEach(function(e){
    if(!e.n)add("error",e,null,"Entity without a name");
    if(!e.d)add("warn",e,null,"No description of what it is");
    if(!area(e.area))add("warn",e,null,"Not placed in an area, shown under Unsorted");
    if(!deg[e.id]&&e.id!=="MD-14"&&e.id!=="MD-17")add("warn",e,null,"Not connected to anything");
    var names={};
    e.f.forEach(function(f){
      if(!f.n)add("error",e,f,"Field without a name");
      else if(names[f.n])add("error",e,f,"Field name used twice in this entity");
      names[f.n]=1;
      var p=parseT(f.t);
      if(/^(ref|list)\b/.test(f.t||"")&&!p)add("error",e,f,'Points at nothing. Write the target id, like "ref MD-07"');
      else if(p&&!ids[p.id]&&!E(p.id))add("error",e,f,"Points at "+p.id+", which does not exist");
      else if(!p&&KNOWN.indexOf(f.t)<0)add("warn",e,f,'Unusual type "'+(f.t||"")+'"');
      if((f.t==="decimal"||f.t==="money")&&!f.nu){
        var has=e.f.some(function(g){return g.n===f.n+" unit"})||(f.t==="decimal"&&e.f.some(function(g){return g.n==="quantity unit"}))||(f.t==="money"&&e.f.some(function(g){return g.n==="currency"}));
        if(!has)add("error",e,f,"Quantity without a unit field");
      }
      var mu=/^(.*) unit$/.exec(f.n||"");
      if(mu&&f.t==="ref MD-14"&&f.n!=="quantity unit"&&f.n!=="base unit"&&!e.f.some(function(g){return g.n===mu[1]}))add("warn",e,f,"Unit for a field that does not exist");
      if(/ and |, /.test(f.n||""))add("warn",e,f,"Name suggests two things in one field");
      ((f.note||"").match(/Q-[A-Z]+\d+/g)||[]).forEach(function(q){if(!qids[q])add("warn",e,f,"Mentions "+q+", which is not in the question list")});
    });
  });
  R.forEach(function(r){
    if(r.kind==="many"&&r.a<r.b&&R.some(function(x){return x.kind==="many"&&x.a===r.b&&x.b===r.a}))add("warn",E(r.a),r.f,"Many-to-many declared from both sides");
    if(r.kind!=="many"&&r.a===r.b)return;
    if(r.kind!=="many"&&R.some(function(x){return x.kind!=="many"&&x.a===r.b&&x.b===r.a})&&r.a<r.b)add("warn",E(r.a),r.f,"Two entities point at each other, one direction is usually enough");
  });
  return out;
}

/* ---------- saving ---------- */
function fileText(st){
  var json=JSON.stringify(st||state,null,1).replace(/</g,"\\u003c");
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Lab ERP model</title>\n<style id="wb-style">'+STYLE_TXT+'</style>\n</head>\n<body>\n'+SHELL_TXT+'<script type="application/json" id="model-data">\n'+json+'\n</scr'+'ipt>\n<script>'+APP_TXT+'</scr'+'ipt>\n</body>\n</html>\n';
}
function touch(){
  if(!LIVE)return;
  dirty=true;clearTimeout(pushT);pushT=setTimeout(push,600);saveState();stats();
}
function saveState(){
  var el=document.getElementById("savestate");if(!el)return;
  if(LIVE){
    if(netErr){el.className="ss-err";el.textContent=netErr;return}
    if(dirty){el.className="ss-dirty";el.textContent="Live, saving…";return}
    el.className="ss-saved";el.textContent="Live, everything saved"+(savedAt?" "+savedAt.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"");return}
  el.className="ss-dirty";el.textContent="Read only";
}
window.addEventListener("beforeunload",function(ev){if(dirty){ev.preventDefault();ev.returnValue=""}});
document.addEventListener("keydown",function(ev){if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();if(LIVE){clearTimeout(pushT);push()}}});

/* ---------- banners: drafts, old notes ---------- */
var BANS=[];
function banner(kind,text,acts,key){BANS=BANS.filter(function(b){return !(key&&b.key===key)&&b.kind!==(kind==="err"?"err":"_")});BANS.push({kind:kind,text:text,acts:acts||[],key:key||kind});drawBanners()}
function clearBanner(key){BANS=BANS.filter(function(b){return b.key!==key});drawBanners()}
function drawBanners(){document.getElementById("banner").innerHTML=BANS.map(function(b,i){return '<div class="ban '+(b.kind==="info"?"info":b.kind==="err"?"err":"")+'"><span>'+b.text+'</span>'+b.acts.map(function(a){return '<button class="sm" data-ban="'+i+'" data-bact="'+a[1]+'">'+esc(a[0])+'</button>'}).join("")+'</div>'}).join("")}
function oldNotes(){
  try{var raw=localStorage.getItem(OLD_KEY);if(!raw)return null;var o=JSON.parse(raw);return countNotes(o)?o:null}catch(e){return null}

function countNotes(o){

function clone(x){return x===undefined?undefined:JSON.parse(JSON.stringify(x))}
function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function keyOf(x){return x&&typeof x==="object"&&!Array.isArray(x)?(x.id!=null?"i:"+x.id:(x.n!=null?"n:"+x.n:null)):null}
function keyMap(a){var m={};for(var i=0;i<a.length;i++){var k=keyOf(a[i]);if(k==null||m[k])return null;m[k]=a[i]}return m}
/* three-way merge: b = last server version this tab knew, l = this tab, s = newest server version.
   Whatever only one side changed is kept; if both changed the same value, this tab wins. */
function merge3(b,l,s){
  if(eq(l,b))return clone(s);if(eq(s,b)||eq(l,s))return clone(l);
  if(Array.isArray(l)&&Array.isArray(s)){
    var bb=Array.isArray(b)?b:[],bm=keyMap(bb),lm=keyMap(l),sm=keyMap(s);
    if(!bm||!lm||!sm)return clone(l);
    var out=[],seen={};
    s.forEach(function(x){var k=keyOf(x);seen[k]=1;
      if(lm[k]!==undefined)out.push(merge3(bm[k],lm[k],x));
      else if(bm[k]===undefined||!eq(x,bm[k]))out.push(clone(x));});
    l.forEach(function(x,i){var k=keyOf(x);if(seen[k])return;
      if(bm[k]!==undefined&&eq(x,bm[k]))return;
      var at=0;for(var j=i-1;j>=0;j--){var pk=keyOf(l[j]),p=out.findIndex(function(y){return keyOf(y)===pk});if(p>=0){at=p+1;break}}
      out.splice(at,0,clone(x));});
    return out;
  }
  if(l&&s&&typeof l==="object"&&typeof s==="object"&&!Array.isArray(l)&&!Array.isArray(s)){
    var o={},bo=(b&&typeof b==="object")?b:{};
    Object.keys(l).concat(Object.keys(s)).forEach(function(k){if(k in o)return;var v=merge3(bo[k],l[k],s[k]);if(v!==undefined)o[k]=v});
    return o;
  }
  return clone(l);
}
function adopt(j){
  if(!j||!j.state||!(j.rev>REV))return;
  var merged=merge3(base,state,j.state);
  base=j.state;REV=j.rev;
  if(!eq(merged,state)){state=merged;render()}
  dirty=!eq(state,base);
  if(dirty){clearTimeout(pushT);pushT=setTimeout(push,300)}
}
async function push(){
  if(!LIVE)return;
  if(inflight){clearTimeout(pushT);pushT=setTimeout(push,300);return}
  if(eq(state,base)){dirty=false;saveState();return}
  inflight=true;var snap=clone(state);
  try{
    var r=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({base:REV,state:snap})});
    var j=await r.json();
    if(r.status===409)adopt(j);
    else if(r.ok){REV=j.rev;base=snap;savedAt=new Date()}
    else throw new Error(j.error||("HTTP "+r.status));
    netErr="";
  }catch(e){netErr="Not connected to the server, retrying. Keep this tab open."}
  inflight=false;
  dirty=!eq(state,base);saveState();
  if(dirty){clearTimeout(pushT);pushT=setTimeout(push,netErr?3000:300)}
}
async function poll(){
  if(!inflight){
    try{var r=await fetch(API+"?since="+REV,{cache:"no-store"});var j=await r.json();
      if(netErr){netErr="";saveState()}
      if(j.state)adopt(j);
    }catch(e){if(!netErr){netErr="Not connected to the server, retrying. Keep this tab open.";saveState()}}
  }
  setTimeout(poll,2500);
}
async function goLive(){
  if(!/^https?:$/.test(location.protocol))return false;
  try{var r=await fetch(API,{cache:"no-store"});if(!r.ok)return false;var j=await r.json();if(!j||!j.state)return false;
    LIVE=true;REV=j.rev;base=j.state;state=clone(j.state);READONLY=false;return true}catch(e){return false}
}

/* ---------- CONNECTIONS ---------- */
function trunc(s,n){s=String(s||"");return s.length>n?s.slice(0,n-1)+"…":s}
function edgePt(cx,cy,hw,hh,tx,ty){var dx=tx-cx,dy=ty-cy,ax=Math.abs(dx),ay=Math.abs(dy);if(ax<.001&&ay<.001)return [cx,cy];var t=Math.min(ax?hw/ax:1e9,ay?hh/ay:1e9);return [cx+dx*t,cy+dy*t]}
function radial(){
  if(!focusId||!E(focusId))focusId=sel&&E(sel)?sel:state.entities[0].id;
  var f=E(focusId),links=[];
  rels().forEach(function(r){if(r.a===focusId&&r.b!==focusId)links.push({o:r.b,out:true,r:r});else if(r.b===focusId&&r.a!==focusId)links.push({o:r.a,out:false,r:r})});
  var n=links.length,W=980,cx=490,rx=n>10?400:330,ry=n>10?210:165,H=Math.max(380,2*ry+90),cy=H/2,hw=96,hh=26,nw=88,nh=24;
  var svg='<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="max-height:620px"><defs><marker id="dar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  if(!n)svg+='<text x="'+cx+'" y="'+(cy-40)+'" text-anchor="middle" style="font-size:13px" fill="var(--tx3)">No connections yet</text>';
  var pts=links.map(function(l,i){var a=-Math.PI/2+i*2*Math.PI/Math.max(n,1);return [cx+rx*Math.cos(a),cy+ry*Math.sin(a)]});
  links.forEach(function(l,i){var p=pts[i],s=edgePt(cx,cy,hw,hh,p[0],p[1]),e=edgePt(p[0],p[1],nw,nh,cx,cy);
    var x1=l.out?s[0]:e[0],y1=l.out?s[1]:e[1],x2=l.out?e[0]:s[0],y2=l.out?e[1]:s[1];
    svg+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--bd2)" stroke-width="1.3"'+(l.r.kind==="opt"?' stroke-dasharray="4 3"':"")+' marker-end="url(#dar)"><title>'+esc(sentence(l.r).s.replace(/<[^>]+>/g,""))+'</title></line>';
    var mx=(s[0]+e[0])/2,my=(s[1]+e[1])/2,t=trunc(l.r.f.l||l.r.f.n,22),w=t.length*6+12;
    svg+='<rect x="'+(mx-w/2).toFixed(1)+'" y="'+(my-9).toFixed(1)+'" width="'+w+'" height="17" rx="8" fill="var(--bg)"/><text x="'+mx.toFixed(1)+'" y="'+(my+3.5).toFixed(1)+'" text-anchor="middle" style="font-size:10.5px" fill="var(--tx3)">'+esc(t)+'</text>';
  });
  links.forEach(function(l,i){var p=pts[i],o=E(l.o)||{n:l.o,area:""},ar=area(o.area),c=ar?ar.color:"gray";
    svg+='<g style="cursor:pointer" data-focus="'+esc(l.o)+'"><rect x="'+(p[0]-nw).toFixed(1)+'" y="'+(p[1]-nh).toFixed(1)+'" width="'+(nw*2)+'" height="'+(nh*2)+'" rx="8" fill="var(--'+c+'-bg)" stroke="var(--'+c+'-br)" stroke-width="1"/>'+
    '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]-5).toFixed(1)+'" text-anchor="middle" style="font-size:10px" fill="var(--'+c+'-tx)" opacity=".75">'+esc(l.o)+'</text>'+
    '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+11).toFixed(1)+'" text-anchor="middle" style="font-size:12.5px;font-weight:600" fill="var(--'+c+'-tx)">'+esc(trunc(o.n,22))+'</text></g>'});
  var fa=area(f.area),fc=fa?fa.color:"gray";
  svg+='<rect x="'+(cx-hw)+'" y="'+(cy-hh)+'" width="'+(hw*2)+'" height="'+(hh*2)+'" rx="10" fill="var(--sf2)" stroke="var(--'+fc+'-br)" stroke-width="2"/>'+
   '<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" style="font-size:10.5px" fill="var(--tx3)">'+esc(f.id)+'</text>'+
   '<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" style="font-size:14.5px;font-weight:600" fill="var(--tx)">'+esc(trunc(f.n,24))+'</text></svg>';
  var opts=state.entities.map(function(e){var c=rels().filter(function(r){return r.a===e.id||r.b===e.id}).length;return '<option value="'+esc(e.id)+'"'+(e.id===focusId?" selected":"")+'>'+esc(e.id)+"  "+esc(e.n)+"  ("+c+")</option>"}).join("");
  return '<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">One entity and its neighbours</h2><span class="row" style="gap:8px"><span class="muted">Centre on</span><select id="focusSel">'+opts+'</select></span></div>'+
    '<p style="margin-bottom:4px">Click a surrounding box to move onto it. Arrows point from the one that holds the reference to the one it refers to. A dashed line may be empty.</p><div class="radwrap">'+svg+'</div></div>';
}

/* ---------- events ---------- */
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="msearch"){query=t.value;applyHL();return}
  if(t.id==="esearch"){query=t.value;var pos=t.selectionStart;render();var n=document.getElementById("esearch");if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  var p=t.getAttribute("data-p");if(!p||READONLY||t.type==="checkbox"||t.tagName==="SELECT")return;
  if(t.tagName==="TEXTAREA")autosize(t);
  setPath(p,t.value);touch();
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="mhl"){hlMode=t.value;applyHL();return}
  if(t.id==="focusSel"){focusId=t.value;render();return}
  if(t.id==="impfile"){importFile(t);return}
  if(READONLY&&(t.hasAttribute("data-idfor")||t.hasAttribute("data-p")))return;
  if(t.hasAttribute("data-idfor")){renameId(+t.getAttribute("data-idfor"),t.value.trim());return}
  var p=t.getAttribute("data-p");if(!p)return;
  if(t.type==="checkbox"){setPath(p,t.checked);if(!t.checked){var k=p.split(".");delete state.entities[+k[1]].f[+k[3]].opt}touch();render();return}
  if(t.tagName==="SELECT"){setPath(p,t.value);touch();if(tab==="map")drawMap();else render();return}
  if(/\.t$/.test(p))setTimeout(function(){var a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render()},0);
});
document.addEventListener("click",function(ev){

  if(d.delf!=null){var a=d.delf.split(".");state.entities[+a[0]].f.splice(+a[1],1);touch();render();return}

  if(d.add==="process"){state.processes.push({id:"P-"+(state.processes.length+1),n:"New process",o:"",steps:"",out:"",q:"",prio:"",v:"",c:""});touch();render();return}

function goEntity(id,edit){
  if(tab==="map"&&!edit){sel=id;applyHL();panel();return}
  tab="entities";filt="all";query="";if(edit)openF[id]=true;render();
  var el=document.getElementById("ent-"+id);if(el){el.scrollIntoView({block:"center"});el.classList.add("flash");setTimeout(function(){el.classList.remove("flash")},1500)}
}
function renameId(i,nid){
  var e=state.entities[i];if(!e||!nid||nid===e.id){render();return}
  if(E(nid)){alert(nid+" is already used.");render();return}
  if(/\s/.test(nid)){alert("An id cannot contain spaces.");render();return}
  var old=e.id,re=new RegExp("^(ref|list)(\\s+)"+reEsc(old)+"\\s*$");
  state.entities.forEach(function(x){x.f.forEach(function(f){if(re.test(f.t))f.t=f.t.replace(re,"$1$2"+nid)})});
  e.id=nid;if(sel===old)sel=nid;if(focusId===old)focusId=nid;if(openF[old]){openF[nid]=true}
  touch();render();
}
function importFile(inp){
  var f=inp.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(o&&o.state)o=o.state;var n=mergeNotes(o);banner("info","Merged "+n+" verdicts, comments and answers from "+esc(f.name)+". They are saved to the server like any other change.",[["OK","close"]],"merged");touch();render()}catch(e){alert("That file could not be read as JSON.")}};
  r.readAsText(f);inp.value="";
}
