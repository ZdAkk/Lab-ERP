<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab ERP — model workbench</title>
<style>
:root{--bg:#faf9f7;--sf:#fff;--sf2:#f3f1ec;--tx:#22211f;--tx2:#5f5e5a;--tx3:#8b8a84;--bd:#e3e0d9;--bd2:#c9c6bd;
--ac:#534ab7;--acbg:#eeedfe;--acbr:#7f77dd;--te:#0f6e56;--tebg:#e1f5ee;--tebr:#1d9e75;
--co:#993c1d;--cobg:#faece7;--cobr:#d85a30;--am:#854f0b;--ambg:#faeeda;--ambr:#ba7517;--r:8px}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a18;--sf:#232321;--sf2:#2b2b28;--tx:#eceae4;--tx2:#a8a69e;--tx3:#7b7a74;--bd:#38372f;--bd2:#4b4a42;
--ac:#afa9ec;--acbg:#3c3489;--acbr:#7f77dd;--te:#9fe1cb;--tebg:#085041;--tebr:#1d9e75;
--co:#f0997b;--cobg:#712b13;--cobr:#d85a30;--am:#fac775;--ambg:#633806;--ambr:#ba7517}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1{font-size:19px;font-weight:600;margin:0}
h2{font-size:17px;font-weight:600;margin:0 0 4px}
h3{font-size:14px;font-weight:600;margin:0 0 6px;color:var(--tx2)}
p{margin:0 0 10px;color:var(--tx2);font-size:14px}
a{color:var(--ac)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:13.5px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acbr);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;line-height:1.6}
button{background:transparent;border:1px solid var(--bd2);border-radius:var(--r);padding:6px 12px;font-size:13.5px;cursor:pointer}
button:hover{background:var(--sf2)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri:hover{opacity:.9}
button.sm{padding:3px 8px;font-size:12px}
button.ic{padding:3px 7px;color:var(--tx3);border-color:transparent}
button.ic:hover{color:var(--co);border-color:var(--bd)}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.stat{font-size:12.5px;color:var(--tx3)}
.stat b{color:var(--tx);font-weight:600}
#saved{font-size:12.5px;color:var(--te)}
.tabs{display:flex;gap:4px;padding:0 20px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:53px;z-index:19;overflow-x:auto}
.tab{padding:9px 14px;font-size:13.5px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--ac);border-bottom-color:var(--acbr);font-weight:600}
main{padding:20px;max-width:1500px;margin:0 auto}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.list{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;position:sticky;top:104px;max-height:calc(100vh - 130px);overflow-y:auto}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);padding:10px 12px 5px;background:var(--sf2)}
.it{padding:7px 12px;cursor:pointer;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;font-size:13.5px}
.it:hover{background:var(--sf2)}
.it.on{background:var(--acbg);color:var(--ac);font-weight:600}
.it .eid{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:40px}
.it.on .eid{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600;padding:0 6px 6px 0;border-bottom:1px solid var(--bd)}
td{padding:4px 6px 4px 0;border-bottom:1px solid var(--bd);vertical-align:top}
.pill{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap;display:inline-block}
.s-B{background:var(--tebg);border-color:var(--tebr);color:var(--te)}
.s-P{background:var(--acbg);border-color:var(--acbr);color:var(--ac)}
.s-O{background:var(--ambg);border-color:var(--ambr);color:var(--am)}
.s-C{background:var(--sf2);border-color:var(--bd2);color:var(--tx2)}
.v-ok{background:var(--tebg);border-color:var(--tebr);color:var(--te)}
.v-change{background:var(--ambg);border-color:var(--ambr);color:var(--am)}
.v-drop{background:var(--cobg);border-color:var(--cobr);color:var(--co)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);font-weight:600;margin-bottom:4px;display:block}
.fld{margin-bottom:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2);align-items:center}
.note{background:var(--sf2);border-radius:var(--r);padding:10px 12px;font-size:13px;color:var(--tx2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.muted{color:var(--tx3);font-size:12.5px}
.steps{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
details{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px}
summary{cursor:pointer;font-size:12.5px;color:var(--tx3);list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary:before{content:"\25B8";font-size:10px;display:inline-block;transition:transform .15s}
details[open] summary:before{transform:rotate(90deg)}
summary:hover{color:var(--ac)}
.ecard{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.ecard.rv-ok{border-left:3px solid var(--tebr)}
.ecard.rv-change{border-left:3px solid var(--ambr)}
.ecard.rv-drop{border-left:3px solid var(--cobr)}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.secth{font-size:13px;font-weight:600;color:var(--tx2);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.secth span{font-weight:400;color:var(--tx3)}
.filt{display:flex;gap:6px}
.filt button.on{background:var(--acbg);border-color:var(--acbr);color:var(--ac)}
.idtag{width:62px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--tx3);background:var(--sf2);border-color:transparent;text-align:center;padding:4px 2px;flex:none}
.idtag:focus{background:var(--sf);border-color:transparent}
@media print{header,.tabs,button{display:none}details>*{display:block}}
</style>
</head>
<body>

<header>
<h1>Lab ERP model workbench</h1>
<span class="stat" id="stats"></span>
<span id="saved"></span>
<span style="margin-left:auto"></span>
<button onclick="exportJSON()">Export JSON</button>
<button onclick="exportMD()">Export Markdown</button>
<button onclick="document.getElementById('imp').click()">Import JSON</button>
<input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(this)">
<button onclick="resetAll()">Reset</button>
</header>

<div class="tabs" id="tabs"></div>
<main id="main"></main>

processes:[
{id:"P-01",n:"Master data import",o:"Systasy sample data arrives",steps:"Receive files and keep the originals untouched\nMap columns to entities, expert checks the mapping\nValidate: every component resolves a material, every material has unit, pack and price\nValidate: every phase, cell type and plate format resolves a recipe\nShow issues in the cleanup workspace, reuse standard ERP\nCommit as master data version 1\nLoad the reference calculation as a test fixture",out:"Complete master data, list of gaps",q:"Q-G02 format of the data",v:"",c:""},
{id:"P-02",n:"Request intake",o:"Customer inquiry or internal screen",steps:"Fill the input form, derived counts shown live\nValidate, list what is missing instead of defaulting\nSave as project in draft\nRun the calculation",out:"Project and calculation run",q:"Today a quote takes hours, target is minutes",v:"",c:""},
{id:"P-03",n:"Layout expansion",o:"Engine stage 1",steps:"Substances times concentrations give conditions\nAdd replicates at the configured level\nAdd control wells\nFit into plates using usable wells, add spares\nGroup plates into batches\nOptionally generate the full well map",out:"Conditions, wells, plates, batches",q:"Q-L02, Q-L03, Q-L04, Q-K03",v:"",c:""},
{id:"P-04",n:"Backward scheduling",o:"Engine stage 2",steps:"Work out the anchor from the desired date and its meaning\nSubtract readout time to data and reporting time\nPlace the readout on the last allowed working day\nWalk the protocol backwards to day 0\nApply the calendar, shift within the step window or warn\nOffset per batch if batches are staggered\nPrepend preparation days, coating and cell thaw\nPrepend procurement order-by dates\nCheck the first required action is not in the past",out:"Dated tasks, project start, conflicts",q:"Q-PL01, Q-P01, Q-P04, Q-W01",v:"",c:""},
{id:"P-05",n:"Media calculation",o:"Engine stage 3, likely the core of the reference",steps:"Per feeding task resolve the recipe and compute the event volume\nGroup events of the same recipe into preparations within shelf life\nPreparation volume is covered demand plus overage, then rounded\nCompute each component amount by its spec type\nBase medium fills the remainder to volume\nComponents added fresh at use are computed per event\nProduce recipe sheets and the media plan",out:"Preparations, component amounts, expiry dates",q:"Q-R02 to Q-R07",v:"",c:""},
{id:"P-06",n:"Materials and stock check",o:"Engine stage 4",steps:"Collect demand from preparations, steps, readouts and consumables\nConvert to base units and apply consumption granularity\nSort demand by need date\nAllocate usable lots, expiry aware, FEFO or FIFO\nAllocate incoming purchase orders arriving in time\nWhat remains is the net need\nRound to packs and compute the order-by date\nFlag orders that would already be too late",out:"Order list, soft reservations, conflicts",q:"Q-M02, Q-M03, Q-M04",v:"",c:""},
{id:"P-07",n:"Procurement",o:"Project released or order lines accepted",steps:"Group order lines by supplier into a purchase order\nSend, confirm, lock\nTrack shipment and ETA\nGoods receipt with lot number and expiry date\nIncoming reservations become lot reservations",out:"Purchase orders, lots, updated stock",q:"Reused from standard ERP almost unchanged",v:"",c:""},
{id:"P-08",n:"Device booking",o:"Engine stage 5",steps:"Generate time demand per task and space demand per batch\nAssign concrete devices of the required type\nCheck against existing confirmed bookings and capacity\nFlag overlaps and over-capacity\nOn release make tentative bookings confirmed",out:"Bookings, calendar view, conflicts",q:"Q-D01, Q-D02, Q-D03",v:"",c:""},
{id:"P-09",n:"Costing, quote, release",o:"Engine stage 7 and handover",steps:"Build typed cost lines for every consumed quantity\nAggregate per plate, batch and project\nGenerate the quote with validity and payment terms\nOn acceptance freeze all snapshots\nOn release create hard reservations, confirm bookings, hand order lines to purchasing",out:"Cost sheet, quote, released project",q:"Q-K01, Q-K02, Q-K05",v:"",c:""},
{id:"P-10",n:"Execution at the bench",o:"Out of scope for the prototype, part of the product",steps:"Daily task list per person\nConfirm a media preparation, pick lots, book the movement\nMark tasks done, skipped or deviated\nDiscard expired preparations and lots\nReplan from the current state after a deviation\nCompare actual against planned cost",out:"Reality recorded against the plan",q:"Q-PL03",v:"",c:""},
{id:"P-11",n:"LIMS export",o:"After layout and readout are known",steps:"Generate the sample list from the well map and sample level\nAssign sample ids by the house convention\nExport in the target format, CSV for the prototype",out:"Sample list file",q:"Q-I01, Q-I02, Q-O03",v:"",c:""},
{id:"P-12",n:"Reference validation",o:"The success criterion, built first",steps:"Encode the reference screen as a request fixture\nEncode the expected outputs line by line\nRun the engine and compare each value against its trace node\nReport matched, delta or missing\nFor each delta find the first diverging node in the trace\nFix the rule or the setting, never hard-code the expected number\nKeep it as an automated test",out:"Green or red, line by line",q:"Q-G03 decides what can even be compared",v:"",c:""}],

   '<div class="two"><div class="fld"><span class="lab">Result</span><input data-p="'+b+'out" value="'+esc(p.out)+'"></div>'+

   '<div class="fld"><span class="lab">Expert comment</span><textarea rows="2" data-p="'+b+'c" placeholder="Is this the real order? What is missing?">'+esc(p.c)+'</textarea></div></div>';
 }).join("");
 return '<div class="card" style="margin-bottom:16px"><h2>Processes</h2><p>Each one is a sequence somebody actually performs, or that the software performs for them. Correct the order, add the step that always gets forgotten, and mark where a person has to decide something.</p></div>'+
  '<div class="cards">'+cards+'</div><div style="margin-top:12px"><button class="sm" data-add="process">+ process</button></div>';
}

function vQuestions(){
 var rows=state.questions.map(function(q,i){
  var b="questions."+i+".";
  return '<tr><td style="width:62px"><input data-p="'+b+'id" value="'+esc(q.id)+'"></td>'+
   '<td><input data-p="'+b+'t" value="'+esc(q.t)+'"></td>'+
   '<td style="width:150px">'+sel(b+"p",q.p,PR)+'</td>'+
   '<td style="width:120px">'+sel(b+"w",q.w,WH)+'</td>'+
   '<td style="width:34%"><textarea rows="2" data-p="'+b+'a" placeholder="answer">'+esc(q.a)+'</textarea></td>'+
   '<td style="width:110px">'+sel(b+"st",q.st,QS)+'</td>'+
   '<td style="width:28px"><button class="ic" data-delq="'+i+'">&times;</button></td></tr>';
 }).join("");
 return '<div class="card"><h2>Open questions</h2><p>Write the answer straight into the row and set the status. Priority A blocks matching Systasy reference calculation, which is how the challenge is scored.</p>'+
  '<div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Question</th><th>Priority</th><th>Who answers</th><th>Answer</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div style="margin-top:10px"><button class="sm" data-add="question">+ question</button></div></div>';
}

document.addEventListener("input",function(ev){
 var t=ev.target,p=t.getAttribute("data-p");
 if(!p)return;
 setPath(p,t.value);save();
});
document.addEventListener("change",function(ev){
 var t=ev.target;
 if(t.tagName!=="SELECT")return;
 if(t.id==="focusSel"){focusId=t.value;render();return}
 var p=t.getAttribute("data-p");
 if(!p)return;
 setPath(p,t.value);save();render();
});
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-tab],[data-ent],[data-filt],[data-tog],[data-focus],[data-add],[data-addf],[data-delf],[data-dele],[data-delr],[data-delp],[data-delq]");
 if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render();return}
 if(t.dataset.tog){openF[t.dataset.tog]=!openF[t.dataset.tog];return}
 if(t.dataset.filt){filt=t.dataset.filt;render();return}
 if(t.dataset.focus){focusId=t.dataset.focus;render();return}
 if(t.dataset.ent){cur=t.dataset.ent;render();return}
 if(t.dataset.addf!=null){state.entities[+t.dataset.addf].f.push({n:"",t:"",s:"P",note:""});save();render();return}
 if(t.dataset.delf!=null){var a=t.dataset.delf.split(".");state.entities[+a[0]].f.splice(+a[1],1);save();render();return}
 if(t.dataset.dele!=null){if(confirm("Delete this entity?")){state.entities.splice(+t.dataset.dele,1);cur=null;save();render()}return}
 if(t.dataset.delr!=null){state.relations.splice(+t.dataset.delr,1);save();render();return}
 if(t.dataset.delp!=null){if(confirm("Delete this process?")){state.processes.splice(+t.dataset.delp,1);save();render()}return}
 if(t.dataset.delq!=null){state.questions.splice(+t.dataset.delq,1);save();render();return}
 if(t.dataset.add==="entity"){var id="NEW-"+(state.entities.length+1);state.entities.push({id:id,g:"Master data",n:"New entity",d:"",v:"",c:"",f:[]});cur=id;save();render();return}
 if(t.dataset.add==="relation"){state.relations.push({id:"R-new",a:state.entities[0].id,b:state.entities[0].id,card:"1 : n",l:"",s:"P",q:"",v:"",c:""});save();render();return}
 if(t.dataset.add==="process"){state.processes.push({id:"P-new",n:"New process",o:"",steps:"",out:"",q:"",v:"",c:""});save();render();return}
 if(t.dataset.add==="question"){state.questions.push({id:"Q-new",t:"",p:"B",w:"Expert",a:"",st:"open"});save();render();return}
});

function dl(name,text,type){
 var b=new Blob([text],{type:type||"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);
}
function exportJSON(){dl("lab-erp-model.json",JSON.stringify(state,null,1),"application/json")}
function importJSON(inp){
 var f=inp.files[0];if(!f)return;
 var r=new FileReader();
 r.onload=function(){try{state=JSON.parse(r.result);cur=null;save();render();alert("Imported.")}catch(e){alert("That file could not be read as JSON.")}};
 r.readAsText(f);inp.value="";
}
function resetAll(){
 if(!confirm("Throw away all edits and comments and go back to the original blueprint?"))return;
 localStorage.removeItem(KEY);state=norm(SEED);cur=null;render();
}
function SN(s){return s==="B"?"BRIEF":s==="P"?"PROPOSED":s==="O"?"OPEN":"STANDARD"}
function VN(v){return v==="ok"?"confirmed":v==="change"?"needs change":v==="drop"?"wrong or not needed":"not reviewed"}
function exportMD(){
 var L=[];
 L.push("# "+state.meta.title+" — model review");
 L.push("");
 L.push("Version "+state.meta.version+", "+state.meta.date+(state.meta.reviewer?", reviewed with "+state.meta.reviewer:""));
 L.push("");
 L.push("## Modules");
 L.push("");
 state.modules.forEach(function(m){
  L.push("### "+m.id+" "+m.n);
  L.push("");
  L.push(m.p);
  L.push("");
  L.push("- Already standard: "+m.reuse);
  L.push("- Open: "+m.open);
  L.push("- Verdict: "+VN(m.v));
  if(m.c)L.push("- Comment: "+m.c);
  L.push("");
 });
 L.push("## Entities");
 L.push("");
 state.entities.forEach(function(e){
  L.push("### "+e.id+" "+e.n);
  L.push("");
  L.push(e.d);
  L.push("");
  L.push("| Field | Type | Status | Note |");
  L.push("|---|---|---|---|");
  e.f.forEach(function(f){L.push("| "+f.n+" | "+f.t+" | "+SN(f.s)+" | "+f.note+" |")});
  L.push("");
  L.push("Verdict: "+VN(e.v));
  if(e.c){L.push("");L.push("Comment: "+e.c)}
  L.push("");
 });
 L.push("## Relationships");
 L.push("");
 L.push("| ID | From | Relationship | To | Cardinality | Status | Open point | Verdict | Comment |");
 L.push("|---|---|---|---|---|---|---|---|---|");
 state.relations.forEach(function(r){
  L.push("| "+r.id+" | "+r.a+" | "+r.l+" | "+r.b+" | "+r.card+" | "+SN(r.s)+" | "+r.q+" | "+VN(r.v)+" | "+r.c+" |");
 });
 L.push("");
 L.push("## Processes");
 L.push("");
 state.processes.forEach(function(p){
  L.push("### "+p.id+" "+p.n);
  L.push("");
  L.push("Trigger: "+p.o);
  L.push("");
  p.steps.split("\n").forEach(function(s,i){if(s.trim())L.push((i+1)+". "+s.trim())});
  L.push("");
  L.push("Result: "+p.out);
  L.push("");
  L.push("Open points: "+p.q);
  L.push("");
  L.push("Verdict: "+VN(p.v));
  if(p.c){L.push("");L.push("Comment: "+p.c)}
  L.push("");
 });
 L.push("## Open questions");
 L.push("");
 L.push("| ID | Question | Priority | Who | Answer | Status |");
 L.push("|---|---|---|---|---|---|");
 state.questions.forEach(function(q){
  L.push("| "+q.id+" | "+q.t+" | "+q.p+" | "+q.w+" | "+(q.a||"").replace(/\n/g," ")+" | "+q.st+" |");
 });
 L.push("");
 dl("lab-erp-model-review.md",L.join("\n"),"text/markdown;charset=utf-8");
}

load();migrate();save();render();
</script>
